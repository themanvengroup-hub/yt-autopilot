# Render recorded episodes and upload them (private) to YouTube.
# Called by poll.yml, or run manually to retry a specific episode.
name: render
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id (blank = all recorded)"
        required: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # pick up the state the poll job just pushed
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Caption font
        run: |
          [ -f assets/fonts/Poppins-ExtraBold.ttf ] || curl -sSfL -o assets/fonts/Poppins-ExtraBold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-ExtraBold.ttf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Render & upload
        id: render
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ inputs.episode }}" ]; then
            python -m autopilot render --episode "${{ inputs.episode }}"
          else
            python -m autopilot render
          fi
      - name: Keep the rendered files for 5 days (debugging / re-use)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ github.run_id }}
          path: |
            .work/*/*.mp4
            .work/*/thumb.jpg
            .work/*/captions.ass
          retention-days: 5
          if-no-files-found: ignore
      - uses: ./.github/actions/commit-state
        if: always()
        with:
          message: "render: upload results"
